# openvuln.clouditera.com — SPA + API on VulnAgent
# Live path managed by certbot; this file is the reference template.
server {
    server_name openvuln.clouditera.com;
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:23100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:23100/health;
        proxy_set_header Host $host;
    }

    root /var/www/openvuln;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/openvuln.clouditera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvuln.clouditera.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = openvuln.clouditera.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name openvuln.clouditera.com;
    return 404;
}
