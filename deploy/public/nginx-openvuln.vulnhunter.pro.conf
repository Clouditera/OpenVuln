# Install on VulnAgent:
#   sudo cp nginx-openvuln.vulnhunter.pro.conf /etc/nginx/sites-available/openvuln.vulnhunter.pro
#   sudo ln -sf /etc/nginx/sites-available/openvuln.vulnhunter.pro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d openvuln.vulnhunter.pro
#
# SPA root: /home/ecs-user/openvuln/www
# API:      127.0.0.1:23100

server {
    listen 80;
    server_name openvuln.vulnhunter.pro;

    # certbot will rewrite this block for ACME + HTTPS redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name openvuln.vulnhunter.pro;

    # Placeholders — certbot --nginx replaces/fills these on first run.
    # If using wildcard / manual cert like vulnhunter.pro, point to:
    #   ssl_certificate     /etc/ssl/openvuln.vulnhunter.pro/fullchain.pem;
    #   ssl_certificate_key /etc/ssl/openvuln.vulnhunter.pro/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/openvuln.vulnhunter.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvuln.vulnhunter.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;

    # API + health → OpenVuln backend (fish port 23100)
    location /api/ {
        proxy_pass http://127.0.0.1:23100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:23100/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA static (same-origin build — no VITE_API_BASE_URL)
    root /home/ecs-user/openvuln/www;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
